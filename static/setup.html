<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Search HQ — Setup</title>
<style>

:root{--bg:#0f1117;--surface:#1a1d27;--border:#2e3347;--text:#e1e4ed;--text-dim:#8b8fa3;--accent:#4f8ff7;--green:#34d399;--red:#f87171;--yellow:#fbbf24;--radius:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:40px;width:100%;max-width:520px}
.logo{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
h1{font-size:22px;font-weight:700;margin-bottom:6px}
.subtitle{font-size:14px;color:var(--text-dim);margin-bottom:20px;line-height:1.5}
.form-group{margin-bottom:20px}
label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px}
input{width:100%;background:#232736;border:1px solid var(--border);border-radius:6px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit;transition:border-color .15s}
input:focus{outline:none;border-color:var(--accent)}
.hint{font-size:12px;color:var(--text-dim);margin-top:5px;line-height:1.4}
.btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;margin-top:8px}
.btn:hover{background:#6ba0f8}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:16px;padding:12px 16px;border-radius:6px;font-size:13px;display:none}
.msg.success{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);color:var(--green)}
.msg.error{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--red)}
.divider{border:none;border-top:1px solid var(--border);margin:24px 0}
.sso{display:block;text-align:center;text-decoration:none;background:transparent;border:1px solid var(--border);color:var(--text)}
.sso:hover{background:#232736}
.hint a{color:var(--accent)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Job Search HQ</div>
  <h1>Welcome — create your admin account</h1>
  <p class="subtitle">This is the account you'll use to sign in and manage the app. You can add other people and optional single sign-on later from Settings.</p>
  <form id="setup-form">
    <div class="form-group"><label>Your name</label><input type="text" id="name" autocomplete="name" required></div>
    <div class="form-group"><label>Email</label><input type="email" id="email" autocomplete="username" required></div>
    <div class="form-group"><label>Password</label><input type="password" id="password" autocomplete="new-password" minlength="10" required><div class="hint">At least 10 characters.</div></div>
    <div class="form-group"><label>Confirm password</label><input type="password" id="confirm" autocomplete="new-password" required></div>
    <div class="form-group" id="token-group" style="display:none"><label>Setup token</label><input type="password" id="setup_token"><div class="hint">This server requires the <code>JSHQ_SETUP_TOKEN</code> value to create the first account.</div></div>
    <button type="submit" class="btn" id="submit-btn">Create admin account</button>
  </form>
  <div id="msg" class="msg error"></div>
</div>
<script>
const $ = id => document.getElementById(id);
fetch('/api/setup/status').then(r => r.json()).then(s => {
  if (!s.needs_admin) location.replace('/auth/login');
  if (s.setup_token_required) { $('token-group').style.display = 'block'; $('setup_token').required = true; }
});
function fail(text) { const m = $('msg'); m.textContent = text; m.style.display = 'block'; }
$('setup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('msg').style.display = 'none';
  if ($('password').value !== $('confirm').value) return fail('Passwords do not match');
  const btn = $('submit-btn');
  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const res = await fetch('/api/setup/admin', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: $('name').value.trim(), email: $('email').value.trim(),
        password: $('password').value, setup_token: $('setup_token').value}),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || 'Setup failed');
    location.href = '/';
  } catch (err) {
    fail(err.message);
    btn.disabled = false; btn.textContent = 'Create admin account';
  }
});
</script>
</body>
</html>
